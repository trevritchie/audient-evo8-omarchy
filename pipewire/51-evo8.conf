## Audient EVO 8 - WirePlumber device & node rules
##
## - Forces 6-channel (analog-surround-51) profile so all 4 inputs and 2 loopback
##   channels are active
## - Uses software mixer and disables ALSA mixer path probing so PipeWire/ACP
##   never touches ALSA mixer control #4 (FU10 channels 5/6)
## - Disables idle suspension to prevent USB audio clicks/pops on resume
## - Demotes raw 6ch hardware nodes so only clean stereo virtual devices are chosen
##
## Install: ~/.config/wireplumber/wireplumber.conf.d/51-evo8.conf

monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.usb-Audient_EVO8-00" }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = true
        api.alsa.disable-mixer-path = true
        api.alsa.ignore-dB = true
        device.profile = "output:analog-surround-51+input:analog-surround-51"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Audient_EVO8-00.*" }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
        node.description = "EVO 8 Hardware (6ch)"
        node.nick = "EVO 8 Hardware (6ch)"
        channelmix.upmix = false
        priority.driver = 100
        priority.session = 100
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-Audient_EVO8-00.*" }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = false
        session.suspend-timeout-seconds = 0
        node.description = "EVO 8 Hardware Capture (6ch)"
        node.nick = "EVO 8 Hardware Capture (6ch)"
        priority.driver = 100
        priority.session = 100
      }
    }
  }
]
