# Audient EVO 8 PipeWire Channel Configuration
#
# The EVO 8 exposes 6 USB channels in each direction:
#
#   Playback (host -> device):
#     CH1/CH2 (FL/FR)     - Main output 1+2 (PC 1+2 in mixer)
#     CH3/CH4 (FC/LFE)    - Output 3+4 (PC 3+4 in mixer)
#     CH5/CH6 (RL/RR)     - Loopback Send 1+2 (LOOP-BACK 1+2 in mixer)
#
#   Capture (device -> host):
#     CH1/CH2 (FL/FR)     - Mic / Line 1+2 (Input 1 is front Guitar DI)
#     CH3/CH4 (FC/LFE)    - Mic / Line 3+4
#     CH5/CH6 (RL/RR)     - Loopback 1+2 (recording capture)
#
# Install: ~/.config/pipewire/pipewire.conf.d/evo8-stereo.conf

context.properties = {
    default.clock.rate          = 48000
    default.clock.allowed-rates = [ 44100 48000 88200 96000 ]
    default.clock.quantum       = 1024
    default.clock.min-quantum   = 32
    default.clock.max-quantum   = 2048
}

context.modules = [
    # -- Main Stereo Output 1+2 (CH1/CH2) ------------------------------------
    {   name = libpipewire-module-loopback
        args = {
            node.description = "EVO 8 Main Output 1+2"
            capture.props = {
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                node.name = "evo8_main_output"
                node.description = "EVO 8 Main Output 1+2"
                priority.driver = 2000
                priority.session = 2000
            }
            playback.props = {
                node.name = "evo8_main_output.hw"
                target.object = "alsa_output.usb-Audient_EVO8-00.analog-surround-51"
                node.target = "alsa_output.usb-Audient_EVO8-00.analog-surround-51"
                audio.channels = 2
                audio.position = [ FL FR ]
                stream.dont-remix = true
                node.dont-reconnect = true
            }
        }
    }
    # -- Output 3+4 (CH3/CH4) ------------------------------------------------
    {   name = libpipewire-module-loopback
        args = {
            node.description = "EVO 8 Output 3+4"
            capture.props = {
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                node.name = "evo8_output_3_4"
                node.description = "EVO 8 Output 3+4"
                priority.driver = 1500
                priority.session = 1500
            }
            playback.props = {
                node.name = "evo8_output_3_4.hw"
                target.object = "alsa_output.usb-Audient_EVO8-00.analog-surround-51"
                node.target = "alsa_output.usb-Audient_EVO8-00.analog-surround-51"
                audio.channels = 2
                audio.position = [ FC LFE ]
                stream.dont-remix = true
                node.dont-reconnect = true
            }
        }
    }
    # -- Loopback Send 1+2 (CH5/CH6) -----------------------------------------
    {   name = libpipewire-module-loopback
        args = {
            node.description = "EVO 8 Loopback Send 1+2"
            capture.props = {
                media.class = Audio/Sink
                audio.channels = 2
                audio.position = [ FL FR ]
                node.name = "evo8_loopback_output"
                node.description = "EVO 8 Loopback Send 1+2"
                priority.driver = 1200
                priority.session = 1200
            }
            playback.props = {
                node.name = "evo8_loopback_output.hw"
                target.object = "alsa_output.usb-Audient_EVO8-00.analog-surround-51"
                node.target = "alsa_output.usb-Audient_EVO8-00.analog-surround-51"
                audio.channels = 2
                audio.position = [ RL RR ]
                stream.dont-remix = true
                node.dont-reconnect = true
            }
        }
    }
    # -- Mic / Line 1+2 (CH1/CH2) --------------------------------------------
    {   name = libpipewire-module-loopback
        args = {
            node.description = "EVO 8 Mic / Line 1+2"
            capture.props = {
                node.name = "evo8_mic_1_2.hw"
                target.object = "alsa_input.usb-Audient_EVO8-00.analog-surround-51"
                node.target = "alsa_input.usb-Audient_EVO8-00.analog-surround-51"
                audio.channels = 2
                audio.position = [ FL FR ]
                stream.dont-remix = true
                node.dont-reconnect = true
                node.passive = true
            }
            playback.props = {
                media.class = Audio/Source
                audio.channels = 2
                audio.position = [ FL FR ]
                node.name = "evo8_mic_1_2"
                node.description = "EVO 8 Mic / Line 1+2"
                priority.driver = 2000
                priority.session = 2000
            }
        }
    }
    # -- Mic / Line 3+4 (CH3/CH4) --------------------------------------------
    {   name = libpipewire-module-loopback
        args = {
            node.description = "EVO 8 Mic / Line 3+4"
            capture.props = {
                node.name = "evo8_mic_3_4.hw"
                target.object = "alsa_input.usb-Audient_EVO8-00.analog-surround-51"
                node.target = "alsa_input.usb-Audient_EVO8-00.analog-surround-51"
                audio.channels = 2
                audio.position = [ FC LFE ]
                stream.dont-remix = true
                node.dont-reconnect = true
                node.passive = true
            }
            playback.props = {
                media.class = Audio/Source
                audio.channels = 2
                audio.position = [ FL FR ]
                node.name = "evo8_mic_3_4"
                node.description = "EVO 8 Mic / Line 3+4"
                priority.driver = 1500
                priority.session = 1500
            }
        }
    }
    # -- Loopback 1+2 Capture (CH5/CH6) --------------------------------------
    {   name = libpipewire-module-loopback
        args = {
            node.description = "EVO 8 Loopback 1+2"
            capture.props = {
                node.name = "evo8_loopback_capture.hw"
                target.object = "alsa_input.usb-Audient_EVO8-00.analog-surround-51"
                node.target = "alsa_input.usb-Audient_EVO8-00.analog-surround-51"
                audio.channels = 2
                audio.position = [ RL RR ]
                stream.dont-remix = true
                node.dont-reconnect = true
                node.passive = true
            }
            playback.props = {
                media.class = Audio/Source
                audio.channels = 2
                audio.position = [ FL FR ]
                node.name = "evo8_loopback_capture"
                node.description = "EVO 8 Loopback 1+2"
                priority.driver = 1400
                priority.session = 1400
            }
        }
    }
]
